version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pharmacy_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pharmacy_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    container_name: pharmacy_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/pharmacy_db?schema=public"
      PORT: 5000
      NODE_ENV: development
    depends_on:
      - postgres

volumes:
  postgres_data:
